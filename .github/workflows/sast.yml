name: SAST

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run Semgrep
        run: >
          semgrep
          --config auto
          --config .semgrep/custom-rules.yml
          --error .