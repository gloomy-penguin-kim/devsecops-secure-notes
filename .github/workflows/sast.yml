name: SAST

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Semgrep
        run: >
          semgrep
          --config auto
          --config .semgrep/custom-rules.yml
          --error .